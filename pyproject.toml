[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lb-audit"
version = "0.1.0"
description = "Budgeted strong-verifier audits against reward hacking in GRPO"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "tatra-labs"}]
keywords = ["rlhf", "grpo", "reward-hacking", "rlvr", "reinforcement-learning", "verifier"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7"]
experiments = ["matplotlib>=3.6"]

[project.urls]
Homepage = "https://github.com/tatra-labs/lb-audit"

[tool.setuptools]
packages = ["lb_audit"]
